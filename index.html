<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>연애 시뮬레이션 미니 게임</title>
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.6.0/p5.js"></script>
  
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background-color: #1a1a2e; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      width: 100%;
      min-height: 100vh;
      overflow-x: hidden;
      overflow-y: auto; 
      
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: center;
    }

    /* 게임 전체 요소를 감싸는 메인 바구니 */
    #game-container {
      position: relative; 
      margin-top: 10px;
      width: 100%;
      max-width: 600px;  
      display: flex;
      flex-direction: column; /* 요소들을 세로로 일렬 정렬 */
      align-items: center;
    }

    canvas {
      display: block;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5); 
      border-radius: 8px;
    }

    /* 🛠️ 추가: 버튼들이 들어갈 전용 하단 구역 (자동 줄바꿈 및 정렬 핵심) */
    #button-container {
      width: calc(100% - 30px); /* 캔버스 좌우 여백 15px씩 맞춤 */
      margin-top: 15px;
      display: flex;
      flex-direction: column;
      gap: 10px; /* 버튼 사이의 간격 고정 */
      box-sizing: border-box;
    }

    /* p5.js가 만드는 모든 버튼들의 공통 스타일을 CSS로 완전 제어 */
    #button-container button {
      width: 100% !important;
      height: auto !important;
      position: static !important; /* p5.js의 강제 위치 지정을 무효화 */
      background-color: #0f3460;
      color: white;
      font-size: 14px;
      font-family: inherit !important;
      font-weight: 500;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      text-align: left;
      padding: 12px 15px;
      line-height: 1.4;
      white-space: normal;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent; 
    }

    #button-container button:hover {
      background-color: #e94560;
    }

    /* 다음 구역 및 리셋 버튼은 가운데 정렬 */
    #button-container .action-btn {
      text-align: center !important;
      background-color: #e94560;
    }
  </style>
</head>
<body>

  <div id="game-container">
    <div id="button-container"></div>
  </div>

  <script src="sketch.js"></script>

</body>
</html>
