<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>연애 시뮬레이션 미니 게임</title>
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.6.0/p5.js"></script>
  
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background-color: #1a1a2e; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      width: 100%;
      min-height: 100vh;
      overflow-x: hidden;
      overflow-y: auto; 
      
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: center;
    }

    /* 메인 컨테이너: 모든 요소가 무조건 '위에서 아래로' 순서대로만 쌓이도록 강제 */
    #game-container {
      width: 100%;
      max-width: 600px;  
      display: flex;
      flex-direction: column; 
      align-items: center;
      padding-top: 10px;
      padding-bottom: 30px;
      box-sizing: border-box;
    }

    /* 캔버스가 들어갈 자리 */
    #canvas-holder {
      width: 100%;
      display: flex;
      justify-content: center;
    }

    canvas {
      display: block;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5); 
      border-radius: 8px;
    }

    /* 🛠️ 구조 대수정: 캔버스 바로 '아래'에 올 수 있도록 순서 고정 */
    #button-container {
      width: 100%; 
      padding: 0 15px; /* 캔버스 안쪽의 사각형 패딩(15px)과 양옆 라인을 칼같이 맞춤 */
      margin-top: 15px;
      display: flex;
      flex-direction: column;
      gap: 12px; /* 버튼과 버튼 사이 간격 */
      box-sizing: border-box;
    }

    /* 버튼 스타일 전면 제어 (가출 및 역주행 차단) */
    #button-container button {
      width: 100% !important;
      height: auto !important;
      position: static !important; /* p5.js가 억지로 위치 지정하는 것 완전 무력화 */
      background-color: #0f3460;
      color: white;
      font-size: 14px;
      font-family: inherit !important;
      font-weight: 500;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      text-align: left;
      padding: 14px 16px;
      line-height: 1.4;
      white-space: normal;
      box-sizing: border-box;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
      -webkit-tap-highlight-color: transparent; 
    }

    #button-container button:hover {
      background-color: #e94560;
    }

    /* 액션 버튼(다음 버튼, 처음부터 다시하기 버튼) 전용 스타일 */
    #button-container .action-btn {
      text-align: center !important;
      background-color: #e94560;
      font-weight: bold !important;
    }
  </style>
</head>
<body>

  <div id="game-container">
    <div id="canvas-holder"></div>
    
    <div id="button-container"></div>
  </div>

  <script src="sketch.js"></script>

</body>
</html>
